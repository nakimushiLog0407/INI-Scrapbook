<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INI Scrapbook</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f7f7f7;
            color: #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
        }

        .header-text {
            min-width: 0;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .description {
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 右上メニュー */
        .menu-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .menu-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #333;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-button:hover {
            background: #e9e9e9;
        }

        .menu-panel {
            display: none;
            position: absolute;
            top: 46px;
            right: 0;
            width: 240px;
            padding: 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            z-index: 1000;
        }

        .menu-panel.open {
            display: block;
        }

        .menu-title {
            padding: 4px 6px 10px;
            color: #777;
            font-size: 12px;
            font-weight: bold;
        }

        .menu-item {
            display: block;
            width: 100%;
            border: none;
            background: transparent;
            padding: 11px 10px;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #f3f3f3;
        }

        .menu-note {
            border-top: 1px solid #eee;
            margin-top: 8px;
            padding: 10px 6px 2px;
            color: #888;
            font-size: 11px;
            line-height: 1.5;
        }

        /* フィルター */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid #ccc;
            background: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-button.active {
            background: #333;
            color: white;
            border-color: #333;
        }

        /* 並び順 */
        .sort-area {
            margin-bottom: 15px;
            font-size: 14px;
        }

        .sort-area select {
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 14px;
        }

        /* 件数 */
        .count {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* 動画カード */
        .video {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
        }

        .video-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .date {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .status-controls {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .status-control {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            cursor: pointer;
        }

        .status-control input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        a {
            color: #06c;
        }

        #restore-file {
            display: none;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="header-text">

            <h1>INI Scrapbook</h1>

            <p class="description">
                YouTube動画一覧
            </p>

        </div>

        <div class="menu-wrapper">

            <button
                id="menu-button"
                class="menu-button"
                type="button"
                aria-label="メニューを開く"
                aria-expanded="false">
                &#8942;
            </button>

            <div
                id="menu-panel"
                class="menu-panel">

                <div class="menu-title">
                    データ管理
                </div>

                <button
                    id="backup-button"
                    class="menu-item"
                    type="button">
                    バックアップを書き出す
                </button>

                <button
                    id="restore-button"
                    class="menu-item"
                    type="button">
                    バックアップから復元
                </button>

                <div class="menu-note">
                    スクラップ状態をJSONファイルとして
                    保存・復元できます。
                </div>

            </div>

        </div>

    </div>


    <div class="filters">

        <button
            class="filter-button active"
            data-filter="all">
            すべて
        </button>

        <button
            class="filter-button"
            data-filter="unprocessed">
            未処理
        </button>

        <button
            class="filter-button"
            data-filter="scrapped">
            スクラップ済み
        </button>

        <button
            class="filter-button"
            data-filter="excluded">
            対象外
        </button>

    </div>


    <div class="sort-area">

        <label for="sort-order">
            並び順：
        </label>

        <select id="sort-order">

            <option value="newest">
                新しい順
            </option>

            <option value="oldest">
                古い順
            </option>

        </select>

    </div>


    <div
        id="count"
        class="count">
    </div>


    <div id="video-list">
        読み込み中……
    </div>


    <input
        type="file"
        id="restore-file"
        accept=".json,application/json">


    <script>

        let allVideos = [];
        let currentFilter = "all";
        let currentSort = "newest";

        const STORAGE_KEY =
            "iniScrapbookStatuses";

        const BACKUP_VERSION = 1;


        /*
         * 保存されているステータスを読み込む
         */
        function loadStatuses() {

            try {

                const saved =
                    localStorage.getItem(
                        STORAGE_KEY
                    );

                return saved
                    ? JSON.parse(saved)
                    : {};

            } catch (error) {

                console.error(
                    "ステータスの読み込みに失敗しました。",
                    error
                );

                return {};

            }

        }


        /*
         * ステータスを保存する
         */
        function saveStatuses(statuses) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(statuses)
            );

        }


        /*
         * 指定した動画の状態を取得
         */
        function getStatus(videoId) {

            const statuses =
                loadStatuses();

            return {

                scrapped:
                    statuses[videoId]?.scrapped
                    === true,

                excluded:
                    statuses[videoId]?.excluded
                    === true

            };

        }


        /*
         * スクラップ状態を変更
         */
        function updateStatus(
            videoId,
            scrapped,
            excluded
        ) {

            const statuses =
                loadStatuses();

            statuses[videoId] = {
                scrapped: scrapped,
                excluded: excluded
            };

            saveStatuses(statuses);

        }


        /*
         * バックアップを書き出す
         */
        function exportBackup() {

            const statuses =
                loadStatuses();

            const backupData = {

                app:
                    "INI Scrapbook",

                version:
                    BACKUP_VERSION,

                exported_at:
                    new Date()
                        .toISOString(),

                statuses:
                    statuses

            };


            const json =
                JSON.stringify(
                    backupData,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            const now =
                new Date();

            const year =
                now.getFullYear();

            const month =
                String(
                    now.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );

            const day =
                String(
                    now.getDate()
                ).padStart(
                    2,
                    "0"
                );


            link.href =
                url;

            link.download =
                `ini-scrapbook-backup-${year}-${month}-${day}.json`;


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();

            URL.revokeObjectURL(
                url
            );

            closeMenu();

        }


        /*
         * バックアップを復元
         */
        function restoreBackup(file) {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    try {

                        const backupData =
                            JSON.parse(
                                event.target.result
                            );


                        if (
                            backupData.app
                            !== "INI Scrapbook"
                        ) {

                            throw new Error(
                                "INI Scrapbookのバックアップではありません。"
                            );

                        }


                        if (
                            backupData.version
                            !== BACKUP_VERSION
                        ) {

                            throw new Error(
                                "対応していないバックアップ形式です。"
                            );

                        }


                        if (
                            !backupData.statuses
                            ||
                            typeof backupData.statuses
                            !== "object"
                            ||
                            Array.isArray(
                                backupData.statuses
                            )
                        ) {

                            throw new Error(
                                "ステータスデータが正しくありません。"
                            );

                        }


                        const confirmed =
                            confirm(
                                "現在のスクラップ状態を、このバックアップの内容で置き換えます。\n\n復元してもよろしいですか？"
                            );


                        if (!confirmed) {

                            return;

                        }


                        saveStatuses(
                            backupData.statuses
                        );

                        displayVideos();

                        alert(
                            "バックアップを復元しました。"
                        );


                    } catch (error) {

                        console.error(
                            error
                        );

                        alert(
                            "バックアップを復元できませんでした。\n\n"
                            +
                            error.message
                        );

                    }

                };


            reader.onerror =
                () => {

                    alert(
                        "バックアップファイルを読み込めませんでした。"
                    );

                };


            reader.readAsText(
                file
            );

        }


        /*
         * メニュー
         */
        const menuButton =
            document.getElementById(
                "menu-button"
            );

        const menuPanel =
            document.getElementById(
                "menu-panel"
            );


        function openMenu() {

            menuPanel
                .classList
                .add("open");

            menuButton.setAttribute(
                "aria-expanded",
                "true"
            );

        }


        function closeMenu() {

            menuPanel
                .classList
                .remove("open");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        function toggleMenu() {

            if (
                menuPanel
                    .classList
                    .contains("open")
            ) {

                closeMenu();

            } else {

                openMenu();

            }

        }


        menuButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                toggleMenu();

            }
        );


        menuPanel.addEventListener(
            "click",
            event => {

                event.stopPropagation();

            }
        );


        document.addEventListener(
            "click",
            () => {

                closeMenu();

            }
        );


        /*
         * YouTube動画データを読み込む
         */
        fetch("data/youtube_videos.json")
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "動画データを取得できませんでした。"
                    );

                }

                return response.json();

            })
            .then(videos => {

                allVideos =
                    videos;

                displayVideos();

            })
            .catch(error => {

                document
                    .getElementById(
                        "video-list"
                    )
                    .textContent =
                    "動画データの読み込みに失敗しました。";

                console.error(
                    error
                );

            });


        /*
         * 動画一覧を表示
         */
        function displayVideos() {

            const list =
                document.getElementById(
                    "video-list"
                );

            const count =
                document.getElementById(
                    "count"
                );

            list.innerHTML =
                "";


            /*
             * フィルター
             */
            const filteredVideos =
                allVideos.filter(
                    video => {

                        const status =
                            getStatus(
                                video.video_id
                            );


                        if (
                            currentFilter
                            === "all"
                        ) {

                            return true;

                        }


                        if (
                            currentFilter
                            === "unprocessed"
                        ) {

                            return (
                                !status.scrapped
                                &&
                                !status.excluded
                            );

                        }


                        if (
                            currentFilter
                            === "scrapped"
                        ) {

                            return (
                                status.scrapped
                            );

                        }


                        if (
                            currentFilter
                            === "excluded"
                        ) {

                            return (
                                status.excluded
                            );

                        }


                        return true;

                    }
                );


            /*
             * 公開日で並び替え
             */
            filteredVideos.sort(
                (a, b) => {

                    const dateA =
                        new Date(
                            a.published_at
                        );

                    const dateB =
                        new Date(
                            b.published_at
                        );


                    if (
                        currentSort
                        === "newest"
                    ) {

                        return (
                            dateB - dateA
                        );

                    }


                    return (
                        dateA - dateB
                    );

                }
            );


            /*
             * 件数
             */
            count.textContent =
                `${filteredVideos.length}件`;


            /*
             * 動画カード
             */
            filteredVideos.forEach(
                video => {

                    const currentStatus =
                        getStatus(
                            video.video_id
                        );


                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "video";


                    /*
                     * タイトル
                     */
                    const title =
                        document.createElement(
                            "div"
                        );

                    title.className =
                        "video-title";

                    title.textContent =
                        video.title;


                    /*
                     * 公開日
                     */
                    const date =
                        document.createElement(
                            "div"
                        );

                    date.className =
                        "date";


                    const publishedDate =
                        new Date(
                            video.published_at
                        );


                    date.textContent =
                        "公開日：" +
                        publishedDate
                            .toLocaleDateString(
                                "ja-JP"
                            );


                    /*
                     * ステータスエリア
                     */
                    const statusControls =
                        document.createElement(
                            "div"
                        );

                    statusControls.className =
                        "status-controls";


                    /*
                     * スクラップ済み
                     */
                    const scrapLabel =
                        document.createElement(
                            "label"
                        );

                    scrapLabel.className =
                        "status-control";


                    const scrapInput =
                        document.createElement(
                            "input"
                        );

                    scrapInput.type =
                        "checkbox";

                    scrapInput.checked =
                        currentStatus.scrapped;


                    scrapLabel.appendChild(
                        scrapInput
                    );

                    scrapLabel.append(
                        "スクラップ済み"
                    );


                    /*
                     * スクラップ対象外
                     */
                    const excludedLabel =
                        document.createElement(
                            "label"
                        );

                    excludedLabel.className =
                        "status-control";


                    const excludedInput =
                        document.createElement(
                            "input"
                        );

                    excludedInput.type =
                        "checkbox";

                    excludedInput.checked =
                        currentStatus.excluded;


                    excludedLabel.appendChild(
                        excludedInput
                    );

                    excludedLabel.append(
                        "スクラップ対象外"
                    );


                    statusControls.appendChild(
                        scrapLabel
                    );

                    statusControls.appendChild(
                        excludedLabel
                    );


                    /*
                     * 「スクラップ済み」を変更
                     */
                    scrapInput.addEventListener(
                        "change",
                        () => {

                            /*
                             * スクラップ済みにしたら
                             * 対象外を解除
                             */
                            if (
                                scrapInput.checked
                            ) {

                                excludedInput.checked =
                                    false;

                            }


                            updateStatus(
                                video.video_id,
                                scrapInput.checked,
                                excludedInput.checked
                            );


                            if (
                                currentFilter
                                !== "all"
                            ) {

                                displayVideos();

                            }

                        }
                    );


                    /*
                     * 「スクラップ対象外」を変更
                     */
                    excludedInput.addEventListener(
                        "change",
                        () => {

                            /*
                             * 対象外にしたら
                             * スクラップ済みを解除
                             */
                            if (
                                excludedInput.checked
                            ) {

                                scrapInput.checked =
                                    false;

                            }


                            updateStatus(
                                video.video_id,
                                scrapInput.checked,
                                excludedInput.checked
                            );


                            if (
                                currentFilter
                                !== "all"
                            ) {

                                displayVideos();

                            }

                        }
                    );


                    /*
                     * YouTubeリンク
                     */
                    const link =
                        document.createElement(
                            "a"
                        );

                    link.href =
                        video.url;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                    link.textContent =
                        "YouTubeを見る";


                    /*
                     * カードに追加
                     */
                    item.appendChild(
                        title
                    );

                    item.appendChild(
                        date
                    );

                    item.appendChild(
                        statusControls
                    );

                    item.appendChild(
                        link
                    );


                    list.appendChild(
                        item
                    );

                }
            );


            /*
             * 該当動画が0件の場合
             */
            if (
                filteredVideos.length
                === 0
            ) {

                list.textContent =
                    "該当する動画はありません。";

            }

        }


        /*
         * フィルターボタン
         */
        document
            .querySelectorAll(
                ".filter-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            currentFilter =
                                button
                                    .dataset
                                    .filter;


                            document
                                .querySelectorAll(
                                    ".filter-button"
                                )
                                .forEach(
                                    otherButton => {

                                        otherButton
                                            .classList
                                            .remove(
                                                "active"
                                            );

                                    }
                                );


                            button
                                .classList
                                .add(
                                    "active"
                                );


                            displayVideos();

                        }
                    );

                }
            );


        /*
         * 並び順を変更
         */
        document
            .getElementById(
                "sort-order"
            )
            .addEventListener(
                "change",
                event => {

                    currentSort =
                        event.target.value;

                    displayVideos();

                }
            );


        /*
         * バックアップを書き出す
         */
        document
            .getElementById(
                "backup-button"
            )
            .addEventListener(
                "click",
                exportBackup
            );


        /*
         * 復元ボタン
         */
        document
            .getElementById(
                "restore-button"
            )
            .addEventListener(
                "click",
                () => {

                    closeMenu();

                    document
                        .getElementById(
                            "restore-file"
                        )
                        .click();

                }
            );


        /*
         * 復元ファイルを選択
         */
        document
            .getElementById(
                "restore-file"
            )
            .addEventListener(
                "change",
                event => {

                    const file =
                        event
                            .target
                            .files[0];


                    if (!file) {

                        return;

                    }


                    restoreBackup(
                        file
                    );


                    event.target.value =
                        "";

                }
            );

    </script>

</body>
</html>
