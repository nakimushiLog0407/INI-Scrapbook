<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INI Scrapbook</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f7f7f7;
            color: #333;
        }

        h1 {
            margin-bottom: 5px;
        }

        .description {
            color: #666;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid #ccc;
            background: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-button.active {
            background: #333;
            color: white;
            border-color: #333;
        }

        .video {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
        }

        .video-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .date {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .status-controls {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .status-control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .status-control input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .status {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        a {
            color: #06c;
        }

        .count {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <h1>INI Scrapbook</h1>

    <p class="description">
        YouTube動画一覧
    </p>

    <div class="filters">
        <button class="filter-button active" data-filter="all">
            すべて
        </button>

        <button class="filter-button" data-filter="unchecked">
            未確認
        </button>

        <button class="filter-button" data-filter="checked">
            確認済み
        </button>

        <button class="filter-button" data-filter="scrapped">
            スクラップ済み
        </button>
    </div>

    <div id="count" class="count"></div>

    <div id="video-list">
        読み込み中……
    </div>


    <script>

        let allVideos = [];
        let currentFilter = "all";

        const STORAGE_KEY = "iniScrapbookStatuses";


        // ブラウザに保存されているステータスを取得
        function loadStatuses() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                return saved
                    ? JSON.parse(saved)
                    : {};

            } catch (error) {

                console.error(
                    "ステータスの読み込みに失敗しました。",
                    error
                );

                return {};

            }

        }


        // ステータスをブラウザに保存
        function saveStatuses(statuses) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(statuses)
            );

        }


        // 動画の現在のステータスを取得
        function getStatus(videoId) {

            const statuses = loadStatuses();

            return statuses[videoId] || {
                checked: false,
                scrapped: false
            };

        }


        // 動画のステータスを変更
        function updateStatus(
            videoId,
            checked,
            scrapped
        ) {

            const statuses = loadStatuses();

            statuses[videoId] = {
                checked: checked,
                scrapped: scrapped
            };

            saveStatuses(statuses);

        }


        // 動画データを読み込む
        fetch("data/youtube_videos.json")
            .then(response => response.json())
            .then(videos => {

                allVideos = videos;

                displayVideos();

            })
            .catch(error => {

                document.getElementById(
                    "video-list"
                ).textContent =
                    "動画データの読み込みに失敗しました。";

                console.error(error);

            });


        // 動画を表示する
        function displayVideos() {

            const list =
                document.getElementById("video-list");

            const count =
                document.getElementById("count");

            list.innerHTML = "";


            // フィルター
            const filteredVideos =
                allVideos.filter(video => {

                    const status =
                        getStatus(video.video_id);

                    if (currentFilter === "all") {
                        return true;
                    }

                    if (currentFilter === "unchecked") {
                        return !status.checked;
                    }

                    if (currentFilter === "checked") {
                        return status.checked;
                    }

                    if (currentFilter === "scrapped") {
                        return status.scrapped;
                    }

                    return true;

                });


            // 件数
            count.textContent =
                `${filteredVideos.length}件`;


            // 動画を表示
            filteredVideos.forEach(video => {

                const currentStatus =
                    getStatus(video.video_id);


                const item =
                    document.createElement("div");

                item.className = "video";


                const title =
                    document.createElement("div");

                title.className = "video-title";
                title.textContent = video.title;


                const date =
                    document.createElement("div");

                date.className = "date";

                const publishedDate =
                    new Date(video.published_at);

                date.textContent =
                    "公開日：" +
                    publishedDate.toLocaleDateString(
                        "ja-JP"
                    );


                // チェックボックスエリア
                const controls =
                    document.createElement("div");

                controls.className =
                    "status-controls";


                // 確認済み
                const checkedLabel =
                    document.createElement("label");

                checkedLabel.className =
                    "status-control";


                const checkedInput =
                    document.createElement("input");

                checkedInput.type = "checkbox";
                checkedInput.checked =
                    currentStatus.checked;


                checkedLabel.appendChild(
                    checkedInput
                );

                checkedLabel.append(
                    "確認済み"
                );


                // スクラップ済み
                const scrappedLabel =
                    document.createElement("label");

                scrappedLabel.className =
                    "status-control";


                const scrappedInput =
                    document.createElement("input");

                scrappedInput.type = "checkbox";
                scrappedInput.checked =
                    currentStatus.scrapped;


                scrappedLabel.appendChild(
                    scrappedInput
                );

                scrappedLabel.append(
                    "スクラップ済み"
                );


                controls.appendChild(
                    checkedLabel
                );

                controls.appendChild(
                    scrappedLabel
                );


                // 状態表示
                const statusText =
                    document.createElement("div");

                statusText.className = "status";


                function refreshStatusText() {

                    if (checkedInput.checked) {

                        if (scrappedInput.checked) {

                            statusText.textContent =
                                "確認済み・スクラップ済み";

                        } else {

                            statusText.textContent =
                                "確認済み・スクラップなし";

                        }

                    } else {

                        statusText.textContent =
                            "未確認";

                    }

                }


                refreshStatusText();


                // ステータス変更時
                function handleStatusChange() {

                    updateStatus(
                        video.video_id,
                        checkedInput.checked,
                        scrappedInput.checked
                    );

                    refreshStatusText();

                }


                checkedInput.addEventListener(
                    "change",
                    handleStatusChange
                );


                scrappedInput.addEventListener(
                    "change",
                    handleStatusChange
                );


                // YouTubeリンク
                const link =
                    document.createElement("a");

                link.href = video.url;
                link.target = "_blank";
                link.textContent =
                    "YouTubeを見る";


                item.appendChild(title);
                item.appendChild(date);
                item.appendChild(controls);
                item.appendChild(statusText);
                item.appendChild(link);


                list.appendChild(item);

            });


            // 動画がない場合
            if (filteredVideos.length === 0) {

                list.textContent =
                    "該当する動画はありません。";

            }

        }


        // フィルターボタン
        document
            .querySelectorAll(".filter-button")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        currentFilter =
                            button.dataset.filter;


                        document
                            .querySelectorAll(
                                ".filter-button"
                            )
                            .forEach(otherButton => {

                                otherButton
                                    .classList
                                    .remove("active");

                            });


                        button.classList.add(
                            "active"
                        );


                        displayVideos();

                    }
                );

            });

    </script>

</body>
</html>
