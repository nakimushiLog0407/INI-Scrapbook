<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INI Scrapbook</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f7f7f7;
            color: #333;
        }

        h1 {
            margin-bottom: 5px;
        }

        .description {
            color: #666;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid #ccc;
            background: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-button.active {
            background: #333;
            color: white;
            border-color: #333;
        }

        .sort-area {
            margin-bottom: 15px;
            font-size: 14px;
        }

        .sort-area select {
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 14px;
        }

        .backup-area {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .backup-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .backup-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .backup-button {
            border: 1px solid #ccc;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .backup-button:hover {
            background: #f3f3f3;
        }

        .backup-note {
            color: #777;
            font-size: 12px;
            margin-top: 10px;
            margin-bottom: 0;
        }

        .video {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
        }

        .video-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .date {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .status-control {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .status-control input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        a {
            color: #06c;
        }

        .count {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #restore-file {
            display: none;
        }
    </style>
</head>

<body>

    <h1>INI Scrapbook</h1>

    <p class="description">
        YouTube動画一覧
    </p>

    <div class="filters">

        <button
            class="filter-button active"
            data-filter="all">
            すべて
        </button>

        <button
            class="filter-button"
            data-filter="unscrapped">
            未スクラップ
        </button>

        <button
            class="filter-button"
            data-filter="scrapped">
            スクラップ済み
        </button>

    </div>

    <div class="sort-area">

        <label for="sort-order">
            並び順：
        </label>

        <select id="sort-order">

            <option value="newest">
                新しい順
            </option>

            <option value="oldest">
                古い順
            </option>

        </select>

    </div>

    <div class="backup-area">

        <div class="backup-title">
            ステータスのバックアップ
        </div>

        <div class="backup-buttons">

            <button
                id="backup-button"
                class="backup-button">
                バックアップを書き出す
            </button>

            <button
                id="restore-button"
                class="backup-button">
                バックアップから復元
            </button>

        </div>

        <p class="backup-note">
            スクラップ済みの状態をJSONファイルとして保存・復元できます。
        </p>

        <input
            type="file"
            id="restore-file"
            accept=".json,application/json">

    </div>

    <div id="count" class="count"></div>

    <div id="video-list">
        読み込み中……
    </div>


    <script>

        let allVideos = [];
        let currentFilter = "all";
        let currentSort = "newest";

        const STORAGE_KEY =
            "iniScrapbookStatuses";

        const BACKUP_VERSION = 1;


        // 保存されているステータスを読み込む
        function loadStatuses() {

            try {

                const saved =
                    localStorage.getItem(
                        STORAGE_KEY
                    );

                return saved
                    ? JSON.parse(saved)
                    : {};

            } catch (error) {

                console.error(
                    "ステータスの読み込みに失敗しました。",
                    error
                );

                return {};

            }

        }


        // ステータスを保存する
        function saveStatuses(statuses) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(statuses)
            );

        }


        // 指定した動画がスクラップ済みか取得
        function isScrapped(videoId) {

            const statuses =
                loadStatuses();

            return (
                statuses[videoId]?.scrapped
                === true
            );

        }


        // スクラップ状態を変更
        function updateScrapStatus(
            videoId,
            scrapped
        ) {

            const statuses =
                loadStatuses();

            statuses[videoId] = {
                scrapped: scrapped
            };

            saveStatuses(statuses);

        }


        // バックアップを書き出す
        function exportBackup() {

            const statuses =
                loadStatuses();

            const backupData = {

                app: "INI Scrapbook",

                version:
                    BACKUP_VERSION,

                exported_at:
                    new Date()
                        .toISOString(),

                statuses:
                    statuses

            };


            const json =
                JSON.stringify(
                    backupData,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            const now =
                new Date();

            const year =
                now.getFullYear();

            const month =
                String(
                    now.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );

            const day =
                String(
                    now.getDate()
                ).padStart(
                    2,
                    "0"
                );


            link.href = url;

            link.download =
                `ini-scrapbook-backup-${year}-${month}-${day}.json`;


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();


            URL.revokeObjectURL(
                url
            );

        }


        // バックアップファイルを復元する
        function restoreBackup(file) {

            const reader =
                new FileReader();


            reader.onload = event => {

                try {

                    const backupData =
                        JSON.parse(
                            event.target.result
                        );


                    // INI Scrapbook用の
                    // バックアップか確認
                    if (
                        backupData.app
                        !== "INI Scrapbook"
                    ) {

                        throw new Error(
                            "INI Scrapbookのバックアップではありません。"
                        );

                    }


                    // バックアップの
                    // バージョンを確認
                    if (
                        backupData.version
                        !== BACKUP_VERSION
                    ) {

                        throw new Error(
                            "対応していないバックアップ形式です。"
                        );

                    }


                    // statusesが
                    // オブジェクトか確認
                    if (
                        !backupData.statuses
                        ||
                        typeof backupData.statuses
                        !== "object"
                        ||
                        Array.isArray(
                            backupData.statuses
                        )
                    ) {

                        throw new Error(
                            "ステータスデータが正しくありません。"
                        );

                    }


                    const confirmed =
                        confirm(
                            "現在のスクラップ状態を、このバックアップの内容で置き換えます。\n\n復元してもよろしいですか？"
                        );


                    if (!confirmed) {

                        return;

                    }


                    saveStatuses(
                        backupData.statuses
                    );


                    displayVideos();


                    alert(
                        "バックアップを復元しました。"
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        "バックアップを復元できませんでした。\n\n" +
                        error.message
                    );

                }

            };


            reader.onerror = () => {

                alert(
                    "バックアップファイルを読み込めませんでした。"
                );

            };


            reader.readAsText(
                file
            );

        }


        // YouTube動画データを読み込む
        fetch("data/youtube_videos.json")
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "動画データを取得できませんでした。"
                    );

                }

                return response.json();

            })
            .then(videos => {

                allVideos = videos;

                displayVideos();

            })
            .catch(error => {

                document
                    .getElementById(
                        "video-list"
                    )
                    .textContent =
                    "動画データの読み込みに失敗しました。";

                console.error(
                    error
                );

            });


        // 動画一覧を表示
        function displayVideos() {

            const list =
                document.getElementById(
                    "video-list"
                );

            const count =
                document.getElementById(
                    "count"
                );

            list.innerHTML = "";


            // フィルター
            const filteredVideos =
                allVideos.filter(
                    video => {

                        const scrapped =
                            isScrapped(
                                video.video_id
                            );


                        if (
                            currentFilter
                            === "all"
                        ) {

                            return true;

                        }


                        if (
                            currentFilter
                            === "unscrapped"
                        ) {

                            return !scrapped;

                        }


                        if (
                            currentFilter
                            === "scrapped"
                        ) {

                            return scrapped;

                        }


                        return true;

                    }
                );


            // 公開日で並び替え
            filteredVideos.sort(
                (a, b) => {

                    const dateA =
                        new Date(
                            a.published_at
                        );

                    const dateB =
                        new Date(
                            b.published_at
                        );


                    if (
                        currentSort
                        === "newest"
                    ) {

                        return (
                            dateB - dateA
                        );

                    }


                    return (
                        dateA - dateB
                    );

                }
            );


            // 件数
            count.textContent =
                `${filteredVideos.length}件`;


            // 動画を表示
            filteredVideos.forEach(
                video => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "video";


                    // タイトル
                    const title =
                        document.createElement(
                            "div"
                        );

                    title.className =
                        "video-title";

                    title.textContent =
                        video.title;


                    // 公開日
                    const date =
                        document.createElement(
                            "div"
                        );

                    date.className =
                        "date";


                    const publishedDate =
                        new Date(
                            video.published_at
                        );


                    date.textContent =
                        "公開日：" +
                        publishedDate
                            .toLocaleDateString(
                                "ja-JP"
                            );


                    // スクラップ済みチェック
                    const scrapLabel =
                        document.createElement(
                            "label"
                        );

                    scrapLabel.className =
                        "status-control";


                    const scrapInput =
                        document.createElement(
                            "input"
                        );

                    scrapInput.type =
                        "checkbox";

                    scrapInput.checked =
                        isScrapped(
                            video.video_id
                        );


                    scrapLabel.appendChild(
                        scrapInput
                    );

                    scrapLabel.append(
                        "スクラップ済み"
                    );


                    // チェック変更時
                    scrapInput
                        .addEventListener(
                            "change",
                            () => {

                                updateScrapStatus(
                                    video.video_id,
                                    scrapInput.checked
                                );


                                if (
                                    currentFilter
                                    !== "all"
                                ) {

                                    displayVideos();

                                }

                            }
                        );


                    // YouTubeリンク
                    const link =
                        document.createElement(
                            "a"
                        );

                    link.href =
                        video.url;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                    link.textContent =
                        "YouTubeを見る";


                    item.appendChild(
                        title
                    );

                    item.appendChild(
                        date
                    );

                    item.appendChild(
                        scrapLabel
                    );

                    item.appendChild(
                        link
                    );


                    list.appendChild(
                        item
                    );

                }
            );


            // 該当動画が0件の場合
            if (
                filteredVideos.length
                === 0
            ) {

                list.textContent =
                    "該当する動画はありません。";

            }

        }


        // フィルターボタン
        document
            .querySelectorAll(
                ".filter-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            currentFilter =
                                button
                                    .dataset
                                    .filter;


                            document
                                .querySelectorAll(
                                    ".filter-button"
                                )
                                .forEach(
                                    otherButton => {

                                        otherButton
                                            .classList
                                            .remove(
                                                "active"
                                            );

                                    }
                                );


                            button
                                .classList
                                .add(
                                    "active"
                                );


                            displayVideos();

                        }
                    );

                }
            );


        // 並び順を変更
        document
            .getElementById(
                "sort-order"
            )
            .addEventListener(
                "change",
                event => {

                    currentSort =
                        event.target.value;

                    displayVideos();

                }
            );


        // バックアップを書き出す
        document
            .getElementById(
                "backup-button"
            )
            .addEventListener(
                "click",
                exportBackup
            );


        // 復元ボタン
        document
            .getElementById(
                "restore-button"
            )
            .addEventListener(
                "click",
                () => {

                    document
                        .getElementById(
                            "restore-file"
                        )
                        .click();

                }
            );


        // 復元するファイルを選択
        document
            .getElementById(
                "restore-file"
            )
            .addEventListener(
                "change",
                event => {

                    const file =
                        event
                            .target
                            .files[0];


                    if (!file) {

                        return;

                    }


                    restoreBackup(
                        file
                    );


                    /*
                     * 同じファイルを
                     * もう一度選択しても
                     * changeイベントが
                     * 発生するようにする。
                     */
                    event.target.value =
                        "";

                }
            );

    </script>

</body>
</html>
