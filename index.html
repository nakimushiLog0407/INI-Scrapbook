<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INI Scrapbook</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f7f7f7;
            color: #333;
        }

        h1 {
            margin-bottom: 5px;
        }

        .description {
            color: #666;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid #ccc;
            background: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-button.active {
            background: #333;
            color: white;
            border-color: #333;
        }

        .video {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
        }

        .video-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .date {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .status-control {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .status-control input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        a {
            color: #06c;
        }

        .count {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <h1>INI Scrapbook</h1>

    <p class="description">
        YouTube動画一覧
    </p>

    <div class="filters">

        <button
            class="filter-button active"
            data-filter="all">
            すべて
        </button>

        <button
            class="filter-button"
            data-filter="unscrapped">
            未スクラップ
        </button>

        <button
            class="filter-button"
            data-filter="scrapped">
            スクラップ済み
        </button>

    </div>

    <div id="count" class="count"></div>

    <div id="video-list">
        読み込み中……
    </div>


    <script>

        let allVideos = [];
        let currentFilter = "all";

        const STORAGE_KEY = "iniScrapbookStatuses";


        // 保存されているステータスを読み込む
        function loadStatuses() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                return saved
                    ? JSON.parse(saved)
                    : {};

            } catch (error) {

                console.error(
                    "ステータスの読み込みに失敗しました。",
                    error
                );

                return {};

            }

        }


        // ステータスを保存する
        function saveStatuses(statuses) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(statuses)
            );

        }


        // 指定した動画がスクラップ済みか取得
        function isScrapped(videoId) {

            const statuses = loadStatuses();

            return (
                statuses[videoId]?.scrapped === true
            );

        }


        // スクラップ状態を変更
        function updateScrapStatus(
            videoId,
            scrapped
        ) {

            const statuses = loadStatuses();

            statuses[videoId] = {
                scrapped: scrapped
            };

            saveStatuses(statuses);

        }


        // YouTube動画データを読み込む
        fetch("data/youtube_videos.json")
            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "動画データを取得できませんでした。"
                    );
                }

                return response.json();

            })
            .then(videos => {

                allVideos = videos;

                displayVideos();

            })
            .catch(error => {

                document
                    .getElementById("video-list")
                    .textContent =
                    "動画データの読み込みに失敗しました。";

                console.error(error);

            });


        // 動画一覧を表示
        function displayVideos() {

            const list =
                document.getElementById(
                    "video-list"
                );

            const count =
                document.getElementById(
                    "count"
                );

            list.innerHTML = "";


            // 現在のフィルターに合う動画だけ取得
            const filteredVideos =
                allVideos.filter(video => {

                    const scrapped =
                        isScrapped(
                            video.video_id
                        );

                    if (
                        currentFilter === "all"
                    ) {
                        return true;
                    }

                    if (
                        currentFilter ===
                        "unscrapped"
                    ) {
                        return !scrapped;
                    }

                    if (
                        currentFilter ===
                        "scrapped"
                    ) {
                        return scrapped;
                    }

                    return true;

                });


            // 件数
            count.textContent =
                `${filteredVideos.length}件`;


            // 動画を表示
            filteredVideos.forEach(video => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className = "video";


                // タイトル
                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "video-title";

                title.textContent =
                    video.title;


                // 公開日
                const date =
                    document.createElement(
                        "div"
                    );

                date.className = "date";

                const publishedDate =
                    new Date(
                        video.published_at
                    );

                date.textContent =
                    "公開日：" +
                    publishedDate
                        .toLocaleDateString(
                            "ja-JP"
                        );


                // スクラップ済みチェック
                const scrapLabel =
                    document.createElement(
                        "label"
                    );

                scrapLabel.className =
                    "status-control";


                const scrapInput =
                    document.createElement(
                        "input"
                    );

                scrapInput.type =
                    "checkbox";

                scrapInput.checked =
                    isScrapped(
                        video.video_id
                    );


                scrapLabel.appendChild(
                    scrapInput
                );

                scrapLabel.append(
                    "スクラップ済み"
                );


                // チェック変更時
                scrapInput.addEventListener(
                    "change",
                    () => {

                        updateScrapStatus(
                            video.video_id,
                            scrapInput.checked
                        );

                        /*
                         * 「未スクラップ」または
                         * 「スクラップ済み」で
                         * 絞り込んでいる場合は、
                         * チェック変更後に一覧を
                         * 更新する。
                         */
                        if (
                            currentFilter
                            !== "all"
                        ) {
                            displayVideos();
                        }

                    }
                );


                // YouTubeリンク
                const link =
                    document.createElement(
                        "a"
                    );

                link.href = video.url;
                link.target = "_blank";
                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    "YouTubeを見る";


                // カードに追加
                item.appendChild(title);
                item.appendChild(date);
                item.appendChild(
                    scrapLabel
                );
                item.appendChild(link);


                list.appendChild(item);

            });


            // 該当動画が0件の場合
            if (
                filteredVideos.length === 0
            ) {

                list.textContent =
                    "該当する動画はありません。";

            }

        }


        // フィルターボタン
        document
            .querySelectorAll(
                ".filter-button"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        currentFilter =
                            button.dataset.filter;


                        document
                            .querySelectorAll(
                                ".filter-button"
                            )
                            .forEach(
                                otherButton => {

                                    otherButton
                                        .classList
                                        .remove(
                                            "active"
                                        );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        displayVideos();

                    }
                );

            });

    </script>

</body>
</html>
