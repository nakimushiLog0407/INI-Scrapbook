name: スクラップ状態一括更新

on:
  workflow_dispatch:
    inputs:
      updates:
        description: "変更する動画の状態（JSON）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: 状態を一括更新
        env:
          UPDATES: ${{ inputs.updates }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data_file = Path("data/youtube_videos.json")

          # 現在の動画データを読み込む
          with data_file.open("r", encoding="utf-8") as file:
              videos = json.load(file)

          # GitHub Pagesから送られてきた変更内容を読み込む
          updates = json.loads(os.environ["UPDATES"])

          if not isinstance(updates, list):
              raise ValueError("updates は配列である必要があります")

          # 動画IDから動画を探せるようにする
          video_map = {
              video["video_id"]: video
              for video in videos
          }

          updated_count = 0

          for update in updates:
              video_id = update.get("video_id")

              if not video_id:
                  raise ValueError("video_id がありません")

              if video_id not in video_map:
                  raise ValueError(
                      f"動画が見つかりません: {video_id}"
                  )

              checked = update.get("checked")
              scrapped = update.get("scrapped")

              if not isinstance(checked, bool):
                  raise ValueError(
                      f"checked が正しくありません: {video_id}"
                  )

              if not isinstance(scrapped, bool):
                  raise ValueError(
                      f"scrapped が正しくありません: {video_id}"
                  )

              video = video_map[video_id]

              video["checked"] = checked
              video["scrapped"] = scrapped

              updated_count += 1

          # JSONを書き戻す
          with data_file.open("w", encoding="utf-8") as file:
              json.dump(
                  videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"{updated_count}件の状態を更新しました。")
          PY

      - name: JSONをGitHubに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/youtube_videos.json

          if git diff --cached --quiet
          then
            echo "変更はありません。"
            exit 0
          fi

          git commit -m "Update scrap statuses"
          git push
