name: スクラップ状態更新

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "動画ID"
        required: true
        type: string

      checked:
        description: "確認済み"
        required: true
        type: boolean

      scrapped:
        description: "スクラップ済み"
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: 状態を更新
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          CHECKED: ${{ inputs.checked }}
          SCRAPPED: ${{ inputs.scrapped }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data_file = Path("data/youtube_videos.json")

          video_id = os.environ["VIDEO_ID"]
          checked = os.environ["CHECKED"].lower() == "true"
          scrapped = os.environ["SCRAPPED"].lower() == "true"

          with data_file.open("r", encoding="utf-8") as file:
              videos = json.load(file)

          found = False

          for video in videos:
              if video["video_id"] == video_id:
                  video["checked"] = checked
                  video["scrapped"] = scrapped
                  found = True
                  break

          if not found:
              raise ValueError(f"動画が見つかりません: {video_id}")

          with data_file.open("w", encoding="utf-8") as file:
              json.dump(
                  videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"更新しました: {video_id}")
          print(f"checked: {checked}")
          print(f"scrapped: {scrapped}")
          PY

      - name: JSONをGitHubに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/youtube_videos.json

          git diff --cached --quiet || git commit -m "Update scrap status"

          git push
