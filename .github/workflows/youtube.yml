name: YouTube動画取得

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Pythonを実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/youtube_collect.py

      - name: JSONファイルをGitHubに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube_videos.json
          git diff --cached --quiet || git commit -m "Update YouTube videos"
          git push
